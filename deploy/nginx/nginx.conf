events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    location = /api/health {
      proxy_pass http://portfolio-api:8080/api/health;
    }

    location /api/short/ {
      rewrite ^/api/short/(.*)$ /api/v1/$1 break;
      proxy_pass http://shortener:8282;
    }

    location /api/ {
      proxy_pass http://portfolio-api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s/ {
      rewrite ^/s/(.*)$ /$1 break;
      proxy_pass http://shortener:8282;
    }

    location /shortener/ {
      alias /usr/share/nginx/html/shortener/;
      try_files $uri $uri/ /shortener/index.html;
    }

    location /chat/ {
      proxy_pass http://websocket:8080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /quiz/ {
      proxy_pass http://quiz:8093/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /board/ {
      proxy_pass http://kanban:8094;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /rooms/ {
      proxy_pass http://kanban:8094;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /uptime/ {
      proxy_pass http://kanban:8094;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /meeting/ {
      proxy_pass http://meeting:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://portfolio-frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
